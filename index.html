<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.O.A.T. For Ronaldo Petition</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #e5a93b;
            font-size: 2.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-align: center;
        }

        p.subtitle {
            color: #aaaaaa;
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
        }

        .card-container {
            position: relative;
            max-width: 450px;
            width: 100%;
            border: 2px solid #e5a93b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(229, 169, 59, 0.3);
            margin-bottom: 20px;
        }

        .card-container img {
            width: 100%;
            display: block;
        }

        .petition-box {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 20px;
            border-radius: 12px;
            max-width: 450px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }

        .counter-title {
            font-size: 1rem;
            color: #888;
            margin-bottom: 5px;
        }

        .counter-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #e5a93b;
            margin-bottom: 15px;
        }

        .sign-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sign-form input {
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #222;
            color: #fff;
            font-size: 1rem;
        }

        .sign-btn {
            background-color: #e5a93b;
            color: #000;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .sign-btn:hover {
            background-color: #f7c263;
            transform: scale(1.02);
        }

        .success-msg {
            display: none;
            color: #4caf50;
            font-weight: bold;
            margin-top: 10px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <h1>B.O.A.T. FOR RONALDO</h1>
    <p class="subtitle">Ballon d'Or of All Time — Official Fan Petition</p>

    <div class="card-container">
        <img src="ronaldo b.o.a.t 7.jpg" alt="Cristiano Ronaldo">
    </div>

    <div class="petition-box">
        <div class="counter-title">ПОДПИСАЛИ ПЕТИЦИЮ:</div>
        <div class="counter-number" id="voteCount">Загрузка...</div>

        <form class="sign-form" id="petitionForm">
            <input type="text" id="signerName" placeholder="Ваше имя / Name" required>
            <button type="submit" class="sign-btn">Подписать петицию</button>
        </form>

        <div class="success-msg" id="successMsg">Спасибо! Ваш голос учтен! 🎉</div>
    </div>

    <script>
        const countDisplay = document.getElementById('voteCount');
        const form = document.getElementById('petitionForm');
        const successMsg = document.getElementById('successMsg');

        // Путь к надежному онлайн-счетчику
        const counterUrl = "https://api.counterapi.dev/v1/boat-ronaldo-2026/signatures";

        // Функция для получения реального числа голосов всех пользователей
        async function getGlobalVotes() {
            try {
                let response = await fetch(counterUrl);
                if (!response.ok) {
                    // Если счетчик еще не создан — создаем его через +1
                    response = await fetch(counterUrl + "/up");
                }
                let data = await response.json();
                countDisplay.textContent = data.count !== undefined ? data.count.toLocaleString() : "0";
            } catch (e) {
                // Если нет соединения, показывает 0
                countDisplay.textContent = "0";
            }
        }

        getGlobalVotes();

        // Проверяем, подписывал ли уже этот браузер
        if (localStorage.getItem('already_signed_boat') === 'true') {
            form.style.display = 'none';
            successMsg.style.display = 'block';
            successMsg.textContent = 'Вы уже подписали эту петицию! 🏆';
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            if (localStorage.getItem('already_signed_boat') !== 'true') {
                try {
                    // Отправляем +1 в общую базу данных для всех пользователей
                    let response = await fetch(counterUrl + "/up");
                    let data = await response.json();
                    if (data.count !== undefined) {
                        countDisplay.textContent = data.count.toLocaleString();
                    }
                } catch (e) {
                    console.log(e);
                }

                localStorage.setItem('already_signed_boat', 'true');
            }

            form.style.display = 'none';
            successMsg.style.display = 'block';
            successMsg.textContent = 'Спасибо! Ваш голос учтен! 🎉';
        });
    </script>

</body>
</html>
