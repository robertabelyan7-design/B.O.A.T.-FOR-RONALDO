<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.O.A.T. For Ronaldo Petition</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #e5a93b;
            font-size: 2.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-align: center;
        }

        p.subtitle {
            color: #aaaaaa;
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
        }

        .card-container {
            position: relative;
            max-width: 450px;
            width: 100%;
            border: 2px solid #e5a93b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(229, 169, 59, 0.3);
            margin-bottom: 20px;
        }

        .card-container img {
            width: 100%;
            display: block;
        }

        .petition-box {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 20px;
            border-radius: 12px;
            max-width: 450px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }

        .counter-title {
            font-size: 1rem;
            color: #888;
            margin-bottom: 5px;
        }

        .counter-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #e5a93b;
            margin-bottom: 15px;
        }

        .sign-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sign-form input {
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #222;
            color: #fff;
            font-size: 1rem;
        }

        .sign-btn {
            background-color: #e5a93b;
            color: #000;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .sign-btn:hover {
            background-color: #f7c263;
            transform: scale(1.02);
        }

        .success-msg {
            display: none;
            color: #4caf50;
            font-weight: bold;
            margin-top: 10px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <h1>B.O.A.T. FOR RONALDO</h1>
    <p class="subtitle">Ballon d'Or of All Time — Official Fan Petition</p>

    <div class="card-container">
        <img src="ronaldo b.o.a.t 7.jpg" alt="Cristiano Ronaldo">
    </div>

    <div class="petition-box">
        <div class="counter-title">ПОДПИСАЛИ ПЕТИЦИЮ:</div>
        <div class="counter-number" id="voteCount">0</div>

        <form class="sign-form" id="petitionForm">
            <input type="text" id="signerName" placeholder="Ваше имя / Name" required>
            <button type="submit" class="sign-btn">Подписать петицию</button>
        </form>

        <div class="success-msg" id="successMsg">Спасибо! Ваш голос учтен! 🎉</div>
    </div>

    <script>
        // Используем уникальный ID базы данных для твоей петиции
        const namespace = "boat-ronaldo-petition-2026";
        const key = "signatures";
        const countDisplay = document.getElementById('voteCount');
        const form = document.getElementById('petitionForm');
        const successMsg = document.getElementById('successMsg');

        // Загружаем текущее число подписей из общей базы
        async function loadVotes() {
            try {
                const response = await fetch(`https://api.countapi.xyz/get/${namespace}/${key}`);
                const data = await response.json();
                if (data.value !== undefined) {
                    countDisplay.textContent = data.value.toLocaleString();
                } else {
                    countDisplay.textContent = "0";
                }
            } catch (e) {
                // Если база еще не создана или оффлайн, используем локальный счетчик
                let localVotes = localStorage.getItem('boat_votes_count') || 0;
                countDisplay.textContent = parseInt(localVotes).toLocaleString();
            }
        }

        loadVotes();

        // Проверяем, подписывал ли уже этот браузер
        if (localStorage.getItem('already_signed_boat') === 'true') {
            form.style.display = 'none';
            successMsg.style.display = 'block';
            successMsg.textContent = 'Вы уже подписали эту петицию! 🏆';
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            if (localStorage.getItem('already_signed_boat') !== 'true') {
                try {
                    // Прибавляем +1 в общую базу данных
                    const response = await fetch(`https://api.countapi.xyz/hit/${namespace}/${key}`);
                    const data = await response.json();
                    if (data.value !== undefined) {
                        countDisplay.textContent = data.value.toLocaleString();
                    }
                } catch (e) {
                    let localVotes = parseInt(localStorage.getItem('boat_votes_count') || 0) + 1;
                    localStorage.setItem('boat_votes_count', localVotes);
                    countDisplay.textContent = localVotes.toLocaleString();
                }

                localStorage.setItem('already_signed_boat', 'true');
            }

            form.style.display = 'none';
            successMsg.style.display = 'block';
            successMsg.textContent = 'Спасибо! Ваш голос учтен! 🎉';
        });
    </script>

</body>
</html>
