<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.O.A.T. For Ronaldo</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #e5a93b;
            font-size: 2.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-align: center;
        }

        p.subtitle {
            color: #aaaaaa;
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 25px;
            text-align: center;
        }

        .card-container {
            position: relative;
            max-width: 450px;
            width: 100%;
            border: 2px solid #e5a93b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(229, 169, 59, 0.3);
        }

        .card-container img {
            width: 100%;
            display: block;
        }

        .vote-btn {
            margin-top: 30px;
            background-color: #e5a93b;
            color: #000;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 15px 35px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s, background-color 0.2s;
        }

        .vote-btn:hover {
            background-color: #f7c263;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>B.O.A.T. FOR RONALDO</h1>
    <p class="subtitle">Ballon d'Or of All Time — 1 Vote = 1 €</p>

    <div class="card-container">
        <!-- Название вашей картинки из репозитория -->
        <img src="ronaldo b.o.a.t 7.jpg" alt="Cristiano Ronaldo">
    </div>

    <a href="#" class="vote-btn">Vote for Ronaldo (1 €)</a>

</body>
</html>
